<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 - Lost in the Himalayas | Vaidya Botanicals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vaidya: {
                            bg: '#121212',
                            soft: '#181A20',
                            card: '#1E2026',
                            accent: '#20E070',
                            accentLight: '#34D399',
                            accentMuted: '#1A382B',
                            textPrimary: '#E2E8F0',
                            textSecondary: '#94A3B8',
                            textMuted: '#64748B'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif']
                    }
                }
            }
        }

<body class="bg-vaidya-bg text-vaidya-textPrimary font-sans min-h-screen flex flex-col items-center justify-center p-6 text-center selection:bg-vaidya-accentMuted selection:text-vaidya-accent">
    <div class="max-w-md w-full bg-vaidya-card rounded-4xl border border-vaidya-accentMuted/60 p-8 sm:p-12 shadow-2xl relative overflow-hidden">

            <i class="fa-solid fa-mountain-sun text-3xl"></i>
        </div>
        <span class="text-xs font-semibold uppercase tracking-widest text-vaidya-accent block mb-2 font-mono">Error 404 &bull; Altitude Sickness</span>

        <p class="text-sm text-vaidya-textSecondary font-light leading-relaxed mb-8">

        </p>
        <a href="/" class="inline-flex items-center justify-center gap-2 bg-vaidya-accent text-vaidya-bg px-6 py-3.5 rounded-full text-sm font-semibold hover:bg-vaidya-accentLight transition-transform active:scale-95 shadow-lg shadow-vaidya-accent/20">
