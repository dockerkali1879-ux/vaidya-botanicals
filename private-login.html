<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vaidya: {
                            bg: '#121212',
                            soft: '#181A20',
                            card: '#1E2026',
                            accent: '#20E070',
                            accentLight: '#34D399',
                            accentMuted: '#1A382B',
                            textPrimary: '#E2E8F0',
                            textSecondary: '#94A3B8',
                            textMuted: '#64748B'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-vaidya-bg text-vaidya-textPrimary min-h-screen flex items-center justify-center p-4 selection:bg-vaidya-accent selection:text-vaidya-bg">
    <div class="w-full max-w-md bg-vaidya-card border border-vaidya-accentMuted/60 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-vaidya-accent/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 rounded-full bg-vaidya-accent/10 flex items-center justify-center text-vaidya-accent">
                <i class="fa-solid fa-lock text-base"></i>
            </div>
            <div>
                <h1 class="font-serif text-xl font-medium text-vaidya-textPrimary">Private Console</h1>
                <p class="text-xs text-vaidya-textMuted">Authorized Personnel Only</p>
            </div>
        </div>

        <div id="error-box" class="hidden mb-4 p-3 rounded-xl bg-red-950/40 border border-red-500/30 text-xs text-red-300"></div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-vaidya-textSecondary mb-1.5">Business Email</label>
                <input type="email" id="email" required autocomplete="username" placeholder="owner@vaidyabotanicals.com"
                    class="w-full bg-vaidya-soft border border-vaidya-accentMuted/40 rounded-xl px-4 py-3 text-sm text-vaidya-textPrimary placeholder:text-vaidya-textMuted/60 focus:outline-none focus:border-vaidya-accent transition-colors">
            </div>

            <div>
                <label class="block text-xs font-medium text-vaidya-textSecondary mb-1.5">Access Credential</label>
                <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••••••"
                    class="w-full bg-vaidya-soft border border-vaidya-accentMuted/40 rounded-xl px-4 py-3 text-sm text-vaidya-textPrimary placeholder:text-vaidya-textMuted/60 focus:outline-none focus:border-vaidya-accent transition-colors">
            </div>

            <button type="submit" id="submit-btn"
                class="w-full mt-2 py-3.5 px-4 rounded-xl bg-vaidya-accent text-vaidya-bg text-sm font-semibold hover:bg-vaidya-accentLight active:scale-[0.99] transition-all flex items-center justify-center gap-2">
                <span id="btn-text">Authenticate</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-vaidya-accentMuted/20 text-center">
            <span class="text-[11px] text-vaidya-textMuted tracking-wider uppercase">Vaidya Botanical Systems</span>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errBox = document.getElementById('error-box');
            const btn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');

            errBox.classList.add('hidden');
            btn.disabled = true;
            btnText.textContent = 'Verifying credentials...';

            try {
                const res = await fetch('/api/auth/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    btnText.textContent = 'Authorized. Redirecting...';
                    window.location.href = '/admin';
                } else {
                    errBox.textContent = data.error || 'Authentication rejected.';
                    errBox.classList.remove('hidden');
                    btn.disabled = false;
                    btnText.textContent = 'Authenticate';
                }
            } catch (err) {
                errBox.textContent = 'Network or server error. Please try again.';
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btnText.textContent = 'Authenticate';
            }
        }
    </script>
</body>
</html>
